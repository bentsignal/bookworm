packages:
  - apps/*
  - packages/*
  - tooling/*
  - "!tooling/github"

catalog:
  "@eslint/js": ^9.38.0
  "@tailwindcss/postcss": ^4.1.16
  "@types/node": ^22.18.12
  eslint: ^9.38.0
  portless: ^0.13.0
  prettier: ^3.6.2
  tailwindcss: ^4.1.16
  typescript: ~6.0.3
  uniwind: ^1.2.2

catalogs:
  react19:
    "@types/react": ~19.2.14
    react: 19.2.3
    react-dom: 19.2.3
    react-native: 0.85.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
